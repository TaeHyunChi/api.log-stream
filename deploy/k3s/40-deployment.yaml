# Pod 로그 실시간 중계 서비스.
#
# 모니터링할 Pod 의 로그를 k8s 에서 follow 로 읽어 WebSocket 으로 흘려보낸다.
# DB 를 쓰지 않아 마이그레이션 Job 이 없다 — 로그의 원본은 k8s 다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-stream-service
  namespace: oncloud-ai
  labels:
    app.kubernetes.io/name: log-stream-service
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      # 워커가 1대라 maxSurge 를 두면 새 Pod 이 뜰 자리가 없다.
      # 교체 중 WebSocket 이 끊기지만 화면이 다시 붙는다.
      maxUnavailable: 1
      maxSurge: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: log-stream-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-stream-service
        app.kubernetes.io/component: api
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # k8s 로그를 읽으려면 이 SA 의 토큰이 필요하다(30-rbac.yaml).
      serviceAccountName: log-stream-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: log-stream-service
          image: oncloud-ai.co.kr:5000/oncloud-ai/log-stream-service:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8246
          envFrom:
            - configMapRef:
                name: log-stream-service-config
          env:
            - name: JWT_SECRET
              valueFrom:
                # 클러스터 공용 Secret. 모든 MSA 서비스가 같은 토큰을 검증한다.
                secretKeyRef: { name: oncloud-ai-jwt, key: jwt-secret }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
